name: Frantic 39 validation

on:
  push:
    branches:
      - frantic-39-claim-verification
    paths:
      - "frantic/**"
      - ".github/workflows/frantic-39-validate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate generated receipt commit
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Add Frantic #39 runx receipt artifacts') }}
        run: node frantic/validator/validate.mjs
        env:
          RUNX_INPUT_ARTIFACT_ROOT: frantic

      - name: Install runx CLI
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Add Frantic #39 runx receipt artifacts') }}
        run: npm install --no-save @runxhq/cli

      - name: Generate public runx receipt
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Add Frantic #39 runx receipt artifacts') }}
        shell: bash
        run: |
          set -euo pipefail

          export RUNX_RECEIPT_SIGN_KID="shaiananvari8-frantic-39-ci"
          export RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64="$(openssl rand -base64 32)"
          export RUNX_RECEIPT_SIGN_ISSUER_TYPE="ci"

          mkdir -p frantic/receipts
          npx runx --version | tee frantic/runx-version.txt
          npx runx init --json | tee frantic/runx-init.json
          npx runx skill ./frantic/validator -i artifact_root=.. --json | tee frantic/runx-validation.json

          receipt_path="$(find .runx -type f -name 'sha256*.json' -print -quit)"
          if [ -z "$receipt_path" ]; then
            echo "No runx receipt file was generated." >&2
            exit 64
          fi

          cp "$receipt_path" frantic/receipts/
          receipt_file="$(basename "$receipt_path")"
          npx runx verify --receipt "frantic/receipts/$receipt_file" --json | tee frantic/verification.json

          node <<'NODE'
          const fs = require("node:fs");

          const repo = process.env.GITHUB_REPOSITORY;
          const branch = process.env.GITHUB_REF_NAME;
          const runId = process.env.GITHUB_RUN_ID;
          const receiptFile = fs.readdirSync("frantic/receipts").find((name) => name.endsWith(".json"));
          if (!receiptFile) {
            throw new Error("receipt file was not generated");
          }

          const publicUrl = `https://github.com/${repo}/blob/${branch}/frantic/claim-verification.md`;
          const evidenceUrl = `https://raw.githubusercontent.com/${repo}/${branch}/frantic/evidence.json`;
          const receiptUrl = `https://raw.githubusercontent.com/${repo}/${branch}/frantic/receipts/${receiptFile}`;
          const reportUrl = `https://raw.githubusercontent.com/${repo}/${branch}/frantic/report.md`;
          const validationUrl = `https://raw.githubusercontent.com/${repo}/${branch}/frantic/runx-validation.json`;
          const verificationUrl = `https://raw.githubusercontent.com/${repo}/${branch}/frantic/verification.json`;

          const evidence = JSON.parse(fs.readFileSync("frantic/evidence.json", "utf8"));
          evidence.runx.receipt_ref = receiptUrl;
          evidence.runx.validation_json = validationUrl;
          evidence.runx.verification_json = verificationUrl;
          evidence.runx.github_actions_run = `https://github.com/${repo}/actions/runs/${runId}`;
          evidence.runx.windows_receipt_store_note = "The Windows host hit runx 0.6.8 receipt-store os error 87, so the recomputable public runx receipt was generated by this Ubuntu GitHub Actions validation run.";
          evidence.public_artifacts = {
            public_url: publicUrl,
            evidence_json: evidenceUrl,
            receipt_ref: receiptUrl,
            report: reportUrl
          };
          evidence.limitations = (evidence.limitations || [])
            .filter((item) => !item.includes("exact runx signed validation receipt"))
            .filter((item) => !item.includes("workflow fallback"))
            .concat("The runx receipt was generated in GitHub Actions on Ubuntu because the local Windows host hit runx 0.6.8 receipt-store os error 87.");
          fs.writeFileSync("frantic/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);

          fs.writeFileSync(
            "frantic/artifact-refs.txt",
            [
              `public_url=${publicUrl}`,
              `evidence_json=${evidenceUrl}`,
              `receipt_ref=${receiptUrl}`,
              `report=${reportUrl}`
            ].join("\n") + "\n"
          );
          NODE

      - name: Commit generated receipt artifacts
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Add Frantic #39 runx receipt artifacts') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frantic/evidence.json frantic/artifact-refs.txt frantic/runx-version.txt frantic/runx-init.json frantic/runx-validation.json frantic/verification.json frantic/receipts/
          if git diff --cached --quiet; then
            echo "No generated receipt changes to commit."
          else
            git commit -m "Add Frantic #39 runx receipt artifacts"
            git push
          fi
