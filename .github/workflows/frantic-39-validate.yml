name: Frantic 39 validation

on:
  push:
    branches:
      - frantic-39-claim-verification
    paths:
      - "frantic/**"
      - ".github/workflows/frantic-39-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate published Frantic artifacts
        run: node frantic/validator/validate.mjs
        env:
          RUNX_INPUT_ARTIFACT_ROOT: frantic
